name: Update Google Scholar Data (Opt-in)

# Phase one uses a static, dated Scholar snapshot. This workflow never runs
# automatically; a maintainer must explicitly dispatch it and confirm the run.
on:
  workflow_dispatch:
    inputs:
      run_crawler:
        description: "Type true to opt in to a one-time Scholar data refresh"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event.inputs.run_crawler == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install crawler dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch Scholar data
        working-directory: google_scholar_crawler
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Publish generated data branch
        working-directory: google_scholar_crawler/results
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.json'
          git commit -m "Update citation data"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:google-scholar-stats --force
